aid: freshsales
name: Freshsales
description: Freshsales is the CRM application from Freshworks designed for sales
  teams, offering contact and account management, deal pipelines, AI-powered lead
  scoring, built-in phone and email, sales sequences, and CPQ. The Freshsales REST
  API enables CRUD access to contacts, accounts, deals, tasks, appointments, notes,
  and products for building integrations and sales workflow automation.

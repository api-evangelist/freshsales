openapi: 3.2.0
info:
  title: Freshsales CRM Deals API
  version: '2026-05-23'
  description: 'Best-effort OpenAPI 3.1 description of the Freshsales (Freshworks CRM)

    REST API. Generated from public documentation; not an official spec.'
  contact:
    name: Freshworks CRM Developer Portal
    url: https://developers.freshworks.com/crm/api/
servers:
- url: https://{bundleAlias}.myfreshworks.com/crm/sales/api
  description: Bundle-alias scoped base URL
  variables:
    bundleAlias:
      default: example
      description: Customer bundle alias (subdomain)
security:
- tokenAuth: []
tags:
- name: Deals
paths:
  /deals:
    post:
      tags:
      - Deals
      operationId: createDeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '201':
          $ref: '#/components/responses/Ok'
      summary: Create deal
      x-summary-source: derived
  /deals/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Deals
      operationId: getDeal
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: Get deal
      x-summary-source: derived
    put:
      tags:
      - Deals
      operationId: updateDeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: Update deal
      x-summary-source: derived
    delete:
      tags:
      - Deals
      operationId: deleteDeal
      responses:
        '204':
          description: No Content
      summary: Delete deal
      x-summary-source: derived
  /deals/view/{view_id}:
    parameters:
    - in: path
      name: view_id
      required: true
      schema:
        type: string
    get:
      tags:
      - Deals
      operationId: listDealsByView
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: List deals by view
      x-summary-source: derived
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Object'
  schemas:
    Object:
      type: object
      additionalProperties: true
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Token-based authentication header in the form

        "Authorization: Token token=YOUR_API_KEY".

        '

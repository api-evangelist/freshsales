# ─── CPQ ─────────────────────────────────────────────────────────────────────

type Product {
  id: ID!
  name: String!
  description: String
  sku: String
  unitPrice: Float!
  currency: String
  active: Boolean!
  variants: [ProductVariant!]
  taxes: [Tax!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ProductVariant {
  id: ID!
  product: Product!
  name: String!
  sku: String
  unitPrice: Float!
  attributes: JSON
  active: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Tax {
  id: ID!
  name: String!
  percentage: Float!
  inclusive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Discount {
  id: ID!
  name: String!
  type: String!
  value: Float!
  conditions: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Quote {
  id: ID!
  name: String!
  deal: Deal!
  contact: Contact
  company: Company
  lineItems: [DealProduct!]
  status: QuoteStatus!
  validUntil: DateTime
  discount: Discount
  taxAmount: Float
  subTotal: Float!
  total: Float!
  terms: String
  createdBy: User!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Order {
  id: ID!
  quote: Quote
  deal: Deal!
  contact: Contact
  company: Company
  lineItems: [DealProduct!]
  status: OrderStatus!
  total: Float!
  currency: String
  createdBy: User!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Invoice {
  id: ID!
  order: Order
  deal: Deal
  contact: Contact
  company: Company
  lineItems: [DealProduct!]
  status: InvoiceStatus!
  dueDate: DateTime
  total: Float!
  currency: String
  payments: [Payment!]
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Payment {
  id: ID!
  invoice: Invoice!
  amount: Float!
  currency: String
  method: String
  transactionId: String
  paidAt: DateTime!
  createdAt: DateTime!
}


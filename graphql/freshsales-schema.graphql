}

# ─── Platform / Auth ─────────────────────────────────────────────────────────

type APIKey {
  id: ID!
  user: User!
  token: String!
  type: TokenType!
  active: Boolean!
  lastUsedAt: DateTime
  createdAt: DateTime!
}

type OAuthToken {
  id: ID!
  user: User!
  provider: String!
  accessToken: String!
  refreshToken: String
  scopes: [String!]
  expiresAt: DateTime
  createdAt: DateTime!
}

type Report {
  id: ID!
  name: String!
  description: String
  type: String!
  filters: [Filter!]
  data: JSON
  createdBy: User!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type FunnelReport {
  id: ID!
  name: String!
  pipeline: Pipeline
  stages: [DealStage!]
  conversionRates: JSON
  totalDeals: Int!
  totalValue: Float!
  dateRange: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

# ─── Root Types ──────────────────────────────────────────────────────────────

type Query {
  contact(id: ID!): Contact
  contacts(ownerId: ID, territoryId: ID, tags: [String!], limit: Int, offset: Int): [Contact!]!

  company(id: ID!): Company
  companies(ownerId: ID, industryId: ID, tags: [String!], limit: Int, offset: Int): [Company!]!

  lead(id: ID!): Lead
  leads(ownerId: ID, status: LeadStatus, limit: Int, offset: Int): [Lead!]!

  deal(id: ID!): Deal
  deals(pipelineId: ID, stageId: ID, ownerId: ID, status: DealStatus, limit: Int, offset: Int): [Deal!]!

  pipeline(id: ID!): Pipeline
  pipelines: [Pipeline!]!

  task(id: ID!): Task
  tasks(ownerId: ID, status: TaskStatus, limit: Int, offset: Int): [Task!]!

  appointment(id: ID!): Appointment
  appointments(ownerId: ID, status: AppointmentStatus, limit: Int, offset: Int): [Appointment!]!

  product(id: ID!): Product
  products(active: Boolean, limit: Int, offset: Int): [Product!]!

  quote(id: ID!): Quote
  quotes(dealId: ID, status: QuoteStatus, limit: Int, offset: Int): [Quote!]!

  user(id: ID!): User
  users(teamId: ID, roleId: ID, active: Boolean, limit: Int, offset: Int): [User!]!

  sequence(id: ID!): Sequence
  sequences(status: SequenceStatus, limit: Int, offset: Int): [Sequence!]!

  report(id: ID!): Report
  reports(limit: Int, offset: Int): [Report!]!

  funnelReport(id: ID!): FunnelReport
  search(query: String!, entityTypes: [String!]): Search!
}

type Mutation {
  createContact(input: JSON!): Contact!
  updateContact(id: ID!, input: JSON!): Contact!
  deleteContact(id: ID!): Boolean!

  createCompany(input: JSON!): Company!
  updateCompany(id: ID!, input: JSON!): Company!
  deleteCompany(id: ID!): Boolean!

  createLead(input: JSON!): Lead!
  updateLead(id: ID!, input: JSON!): Lead!
  convertLead(id: ID!, input: JSON!): LeadConversion!
  deleteLead(id: ID!): Boolean!

  createDeal(input: JSON!): Deal!
  updateDeal(id: ID!, input: JSON!): Deal!
  deleteDeal(id: ID!): Boolean!

  createTask(input: JSON!): Task!
  updateTask(id: ID!, input: JSON!): Task!
  deleteTask(id: ID!): Boolean!

  createAppointment(input: JSON!): Appointment!
  updateAppointment(id: ID!, input: JSON!): Appointment!
  deleteAppointment(id: ID!): Boolean!

  createNote(input: JSON!): Note!
  updateNote(id: ID!, input: JSON!): Note!
  deleteNote(id: ID!): Boolean!

  createProduct(input: JSON!): Product!
  updateProduct(id: ID!, input: JSON!): Product!
  deleteProduct(id: ID!): Boolean!

  createQuote(input: JSON!): Quote!
  updateQuote(id: ID!, input: JSON!): Quote!
  deleteQuote(id: ID!): Boolean!

  createWebhook(input: JSON!): Webhook!
  updateWebhook(id: ID!, input: JSON!): Webhook!
  deleteWebhook(id: ID!): Boolean!
}

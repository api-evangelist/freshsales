type LeadScore {
  id: ID!
  lead: Lead!
  score: Float!
  grade: String
  signals: [String!]
  updatedAt: DateTime!
}

type ContactScore {
  id: ID!
  contact: Contact!
  score: Float!
  grade: String
  signals: [String!]
  updatedAt: DateTime!
}

type FreddyAI {
  id: ID!
  entityType: String!
  entityId: ID!
  insights: [String!]
  recommendations: [String!]
  updatedAt: DateTime!
}

type SmartMatch {
  id: ID!
  contact: Contact
  lead: Lead
  matchedCompany: Company
  confidence: Float!
  matchedAt: DateTime!
}

type Intent {
  id: ID!
  contact: Contact
  signals: [String!]
  intentScore: Float!
  category: String
  updatedAt: DateTime!
}

type ContextData {
  id: ID!
  entityType: String!
  entityId: ID!
  data: JSON!
  source: String

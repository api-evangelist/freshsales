}

type EmailSync {
  id: ID!
  user: User!
  provider: String!
  email: String!
  syncEnabled: Boolean!
  lastSyncedAt: DateTime
  createdAt: DateTime!
}

type CalendarSync {
  id: ID!
  user: User!
  provider: String!
  calendarId: String
  syncEnabled: Boolean!
  lastSyncedAt: DateTime
  createdAt: DateTime!
}

type PhoneIntegration {
  id: ID!
  provider: String!
  phoneNumber: String

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '201':
          $ref: '#/components/responses/Ok'
      summary: Create task
      x-summary-source: derived
  /tasks/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Tasks
      operationId: getTask
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: Get task
      x-summary-source: derived
    put:
      tags:
      - Tasks
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: Update task
      x-summary-source: derived
    delete:
      tags:
      - Tasks
      operationId: deleteTask
      responses:
        '204':
          description: No Content
      summary: Delete task
      x-summary-source: derived
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    Object:

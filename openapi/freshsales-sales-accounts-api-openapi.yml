    url: https://developers.freshworks.com/crm/api/
servers:
- url: https://{bundleAlias}.myfreshworks.com/crm/sales/api
  description: Bundle-alias scoped base URL
  variables:
    bundleAlias:
      default: example
      description: Customer bundle alias (subdomain)
security:
- tokenAuth: []
tags:
- name: Sales Accounts
paths:
  /sales_accounts:
    post:
      tags:
      - Sales Accounts
      operationId: createSalesAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '201':
          $ref: '#/components/responses/Ok'
      summary: Create sales account
      x-summary-source: derived
  /sales_accounts/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Sales Accounts
      operationId: getSalesAccount
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: Get sales account
      x-summary-source: derived
    put:
      tags:
      - Sales Accounts
      operationId: updateSalesAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: Update sales account
      x-summary-source: derived
    delete:
      tags:
      - Sales Accounts
      operationId: deleteSalesAccount
      responses:
        '204':
          description: No Content
      summary: Delete sales account
      x-summary-source: derived
  /sales_accounts/view/{view_id}:
    parameters:
    - in: path
      name: view_id
      required: true
      schema:
        type: string
    get:
      tags:
      - Sales Accounts
      operationId: listSalesAccountsByView
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: List sales accounts by view
      x-summary-source: derived
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Object'
  schemas:
    Object:
      type: object
      additionalProperties: true
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Token-based authentication header in the form

        "Authorization: Token token=YOUR_API_KEY".

        '
